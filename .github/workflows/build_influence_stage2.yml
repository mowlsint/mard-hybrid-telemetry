name: Build Influence Ingest Stage 2

on:
  workflow_dispatch:
    inputs:
      max_endpoints:
        description: "Maximum website and Telegram endpoints for this test run"
        required: false
        default: "240"
      concurrency:
        description: "Parallel requests"
        required: false
        default: "6"

permissions:
  contents: write

concurrency:
  group: mard-influence-repo-writer
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MARD_INFLUENCE_MAX_ENDPOINTS: ${{ inputs.max_endpoints || '240' }}
      MARD_INFLUENCE_CONCURRENCY: ${{ inputs.concurrency || '6' }}
      MARD_INFLUENCE_REQUEST_TIMEOUT_MS: "15000"
      MARD_INFLUENCE_MAX_ITEMS_PER_SOURCE: "12"
      MARD_INFLUENCE_MAX_BODY_BYTES: "3000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Show runtime
        run: node --version

      - name: Validate influence registry
        run: node scripts/influence/validate_influence_registry.mjs

      - name: Fetch website, RSS and Telegram metadata
        run: node scripts/influence/fetch_influence_stage2.mjs

      - name: Check Stage 2 outputs
        run: node scripts/influence/check_influence_stage2.mjs

      - name: Show public ingest status
        run: |
          cat public/influence_ingest_status.json
          cat public/influence_source_health.json

      - name: Commit Stage 2 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/influence/validation_report.json \
            data/influence/ingest/items_latest.json \
            data/influence/ingest/source_health_latest.json \
            public/influence_ingest_status.json \
            public/influence_source_health.json

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Update influence Stage 2 ingest outputs"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Save source diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: influence-source-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/influence/validation_report.json
            data/influence/ingest/*source_health_latest.json
            data/influence/ingest/nitter_preflight_latest.json
            public/influence*ingest_status.json
          retention-days: 30
          if-no-files-found: warn
